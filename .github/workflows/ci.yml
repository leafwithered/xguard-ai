name: CI

on:
  push:
    branches: [main, enhancement-v2]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run contract:test
      - run: pnpm run risk:test
      - run: pnpm run ai:test
      - run: pnpm run decoder:test
      - run: pnpm run fusion:test
