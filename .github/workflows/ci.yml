name: CI

on:
  push:
    branches: [main, enhancement-v2, final-judge-upgrade, final-polish, v3-competition, codex/v4-okx-simulation]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run contract:test
      - run: pnpm run risk:test
      - run: pnpm run ai:test
      - run: pnpm run decoder:test
      - run: pnpm run fusion:test
      - run: pnpm run intelligence:test
      - run: pnpm run transaction-analyzer:test
      - run: pnpm run judge:test
      - run: pnpm run analysis-state:test
      - run: pnpm run consequence:test
      - run: pnpm run intent:test
      - run: pnpm run pipeline:test
      - run: pnpm run token-standard:test
      - run: pnpm run security-benchmark:test
      - run: pnpm run simulation:test
      - run: pnpm run presentation:test
